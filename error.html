<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | Page Not Found</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            display:flex;

            justify-content:center;

            align-items:center;

            height:100vh;

            overflow:hidden;

            background:#050816;

            color:white;

        }

        body::before{

            content:"";

            position:absolute;

            width:600px;

            height:600px;

            background:#4f46e5;

            border-radius:50%;

            filter:blur(180px);

            left:-180px;

            top:-180px;

            opacity:.35;

            animation:move1 12s infinite alternate;

        }

        body::after{

            content:"";

            position:absolute;

            width:600px;

            height:600px;

            background:#06b6d4;

            border-radius:50%;

            filter:blur(180px);

            right:-180px;

            bottom:-180px;

            opacity:.35;

            animation:move2 12s infinite alternate;

        }

        @keyframes move1{

            to{

                transform:translate(200px,150px);

            }

        }

        @keyframes move2{

            to{

                transform:translate(-180px,-150px);

            }

        }

        .container{

            position:relative;

            z-index:2;

            width:90%;

            max-width:700px;

            text-align:center;

            background:rgba(255,255,255,.05);

            backdrop-filter:blur(18px);

            border-radius:20px;

            padding:60px;

            border:1px solid rgba(255,255,255,.1);

            box-shadow:0 0 35px rgba(76,201,240,.3);

            animation:fadeIn 1s ease;

        }

        @keyframes fadeIn{

            from{

                opacity:0;

                transform:translateY(40px);

            }

            to{

                opacity:1;

                transform:translateY(0);

            }

        }

        h1{

            font-size:120px;

            color:#4cc9f0;

            margin-bottom:10px;

            text-shadow:0 0 20px #4cc9f0;

        }

        h2{

            font-size:34px;

            margin-bottom:20px;

        }

        p{

            color:#d8d8d8;

            line-height:1.8;

            margin-bottom:35px;

        }

        a{

            display:inline-block;

            padding:15px 35px;

            background:#4cc9f0;

            color:#05111d;

            text-decoration:none;

            border-radius:40px;

            font-weight:600;

            transition:.3s;

        }

        a:hover{

            transform:translateY(-5px);

            box-shadow:0 0 20px #4cc9f0;

        }

        .emoji{

            font-size:70px;

            margin-bottom:15px;

            animation:float 3s infinite;

        }

        @keyframes float{

            50%{

                transform:translateY(-12px);

            }

        }

        @media(max-width:768px){

            h1{

                font-size:90px;

            }

            h2{

                font-size:28px;

            }

            .container{

                padding:40px 25px;

            }

        }

    </style>

</head>

<body>

<div class="container">

<div class="emoji">☁️</div>

<h1>404</h1>

<h2>Oops! Page Not Found</h2>

<p>

The page you're looking for doesn't exist or may have been moved.

Go back to my DevOps portfolio and continue exploring my AWS, Kubernetes, Docker and Terraform projects.

</p>

<a href="index.html">

🏠 Back to Home

</a>

</div>

</body>

</html>
